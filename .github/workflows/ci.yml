# PR gate for formatting, every Rust target/feature combination, and the
# repository's native-backed unit/integration tests on Ubuntu.
#
# CAVEAT: there is no cheap way to lint this crate — even `cargo check --lib`
# executes build.rs, i.e. a full native CMake build of vendored
# Surelog/UHDM/ANTLR4/Cap'n Proto plus custom link steps. That native pipeline
# is expensive on every platform. This development gate therefore runs against
# glibc Ubuntu; the five release targets and their linkage audits remain the
# job of build-binaries.yml.
name: CI

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Re-check the lockfile when the RustSec advisory database changes even
    # if the repository has had no dependency commit that week.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: check / fmt / clippy / test (ubuntu)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # Each test executable links the large native frontend archives. Strip
      # their debug sections at link time to keep runner disk use bounded.
      # The test profile inherits these settings; assertions remain enabled.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          # build.rs compiles vendor/ directly; required for cargo check too.
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Keep native archives and test executables out of the 10 GB cache budget.
          prefix-key: registry-only-v1
          cache-targets: "false"
          cache-bin: "false"

      # patch(1) is required by build.rs (Surelog submodule patches); cmake,
      # g++ and zlib headers back the non-musl dynamic-link branch used here.
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y patch cmake g++ python3-pip zlib1g-dev
          python3 -m pip install --disable-pip-version-check --user orderedmultidict

      # fmt first: it fails fast without paying for the native build.
      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check (all targets and features)
        run: cargo check --all-targets --all-features

      - name: cargo check (minimal library features)
        run: cargo check --lib --no-default-features

      - name: cargo clippy (-D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Surelog and several boundary tests change process-global state (CWD and
      # C++ singletons), so unit tests in one executable must not overlap.
      - name: cargo test
        run: cargo test --jobs 2 --all-features -- --test-threads=1

      - name: Report runner resources
        if: always()
        run: |
          df -h
          free -h
          du -sh target || true

  generated-runtime-sanitizers:
    name: generated runtime / ASan + UBSan (ubuntu)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # Also strip native archive debug sections from the Rust test runners.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
      CARGO_INCREMENTAL: "0"
      # sim::build forwards these flags to every generated-model C source,
      # including value/string/container runtimes, llg_rt.c, aco.c, and the final link. ACO_USE_ASAN enables
      # libaco's no_sanitize_address annotations on its stack-copy routines.
      LLG_CC: gcc
      LLG_CFLAGS: >-
        -DACO_USE_ASAN -fsanitize=address,undefined
        -fno-omit-frame-pointer -fno-sanitize-recover=all
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: registry-only-v1
          cache-targets: "false"
          cache-bin: "false"

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y patch cmake g++ python3-pip zlib1g-dev
          python3 -m pip install --disable-pip-version-check --user orderedmultidict

      - name: Run generated runtime and model probes under sanitizers
        run: >-
          cargo test --jobs 2 --all-features
          --test runtime_values --test runtime_boundaries --test sim_counter
          --test sim_data_types --test sim_data_types_next --test sim_data_types_completion
          --test sim_function --test sim_loops
          -- --test-threads=1

      - name: Report runner resources
        if: always()
        run: |
          df -h
          free -h
          du -sh target || true

  dependency-audit:
    name: dependency security audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Cargo.lock against RustSec
        run: cargo audit

# CI gate for formatting, every Rust target/feature combination, and the
# repository's native-backed unit/integration tests on Ubuntu.
#
# CAVEAT: there is no cheap way to lint this crate — even `cargo check --lib`
# executes build.rs, i.e. a full native CMake build of vendored Slang plus its
# C ABI and custom link steps. That native pipeline
# is expensive on every platform. This development gate therefore runs against
# glibc Ubuntu; the five release targets and their linkage audits remain the
# job of the build matrix below.
#
# CACHING POLICY (user rule, binding): compiled third-party Cargo dependencies
# are cached; nothing built from this repository is. That means no sccache or
# ccache around the workspace crate or the native Slang/fmt/wrapper build
# (root build.rs; its LLG_CCACHE launcher stays unset here), and
# scripts/ci_prune_cargo_cache.py removes llg, target/slang, test executables
# and archives from every target directory before it is saved. ccache is used
# only for the C of generated test models, through LLG_C_LAUNCHER (see
# .github/actions/ccache-setup). Caches are saved by pushes to master only; releases, manual runs elsewhere and other
# branches restore them.
name: CI and Release

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    # Re-check the lockfile when the RustSec advisory database changes even
    # if the repository has had no dependency commit that week.
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  # Run one nextest test per available logical CPU (.config/nextest.toml).
  NEXTEST_PROFILE: ci

jobs:
  lint:
    name: check / fmt / clippy / test (ubuntu)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # Each test executable links the large native frontend archives. Strip
      # their debug sections at link time to keep runner disk use bounded.
      # Explicit test debug settings override dev inheritance. Apply the disk
      # limits to both profiles; assertions and overflow checks remain enabled.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: debuginfo
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          # build.rs compiles vendor/ directly; required for cargo check too.
          submodules: recursive

      - name: Check tracked simulation fixture inputs
        run: |
          python3 scripts/check_sim_fixture_integrity.py --tracked
          python3 -m unittest discover -s scripts -p test_sim_fixture_integrity.py

      - name: Check parallel test runner and CI cache scripts
        run: |
          python3 -m unittest discover -s scripts -p test_run_tests.py
          python3 -m unittest discover -s scripts -p test_ci_cache.py

      - name: Check the bundled GMP tables against vendor/gmp
        run: python3 scripts/gmp_tables.py --check

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@nextest

      # Compiled registry dependencies of target/debug (check, clippy and the
      # test profile share them), about 0.3 GB. Workspace artifacts are pruned
      # by the action and again by the last step of this job.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: deps-v1
          shared-key: lint-debug
          cache-targets: "true"
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Slang's generated headers require Python. build.rs needs CMake and a
      # C++20 compiler; vendor patches are applied by Rust. Generated models
      # build with Ninja, the default CMake generator.
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build python3

      # fmt first: it fails fast without paying for the native build.
      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check (all targets and features)
        run: cargo check --locked --all-targets --all-features

      - name: cargo check (minimal library features)
        run: cargo check --locked --lib --no-default-features

      - name: cargo clippy (-D warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # Generated models compile through ccache from here on (tests and the
      # frame gate); the cargo builds above ran without it.
      - name: Set up the generated-model compiler cache
        id: ccache
        uses: ./.github/actions/ccache-setup
        with:
          key: lint-ubuntu-22.04

      - name: Generated C coroutine-frame and jump-initialization gate
        run: cargo nextest run --locked --all-features -E 'test(/^generated_c_frame_lint::/)'

      - name: cargo nextest
        run: >-
          cargo nextest run --locked --all-features
          -E 'not test(/^generated_c_frame_lint::/)'

      - name: cargo test (doc tests)
        run: cargo test --locked --doc --all-features

      - name: Owned renderer generated-model and host-lifecycle acceptance
        run: cargo test --locked --lib --no-default-features structured_owned_model_

      - name: Report runner resources
        if: always()
        run: |
          echo "logical CPUs: $(nproc)"
          df -h
          free -h
          du -sh target || true

      - name: Compiler cache statistics and save
        if: always()
        uses: ./.github/actions/ccache-finish
        with:
          key: ${{ steps.ccache.outputs.key }}
          cache-hit: ${{ steps.ccache.outputs.cache-hit }}

      # Last step: the cache is saved after the job, so nothing of llg or
      # Slang (target/slang is outside Cargo's layout) may be left in target/.
      - name: Keep only third-party dependencies in target/
        if: always()
        run: python3 scripts/ci_prune_cargo_cache.py --target-dir target

  generated-runtime-sanitizers:
    name: generated runtime / ASan + UBSan (ubuntu)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # Also strip native archive debug sections from the Rust test runners.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: debuginfo
      CARGO_INCREMENTAL: "0"
      # sim::build forwards these flags to every generated-model C source and
      # the final link. Stackless coroutine frames need no sanitizer exception.
      LLG_CC: gcc
      LLG_CFLAGS: >-
        -fsanitize=address,undefined
        -fno-omit-frame-pointer -fno-sanitize-recover=all
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:log_path=/tmp/llg-asan-ci-model
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: deps-v1
          shared-key: sanitizers-debug
          cache-targets: "true"
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build python3

      # The sanitizer flags in LLG_CFLAGS are part of every ccache hash, so
      # sanitized and plain objects never mix (and this job has its own cache).
      - name: Set up the generated-model compiler cache
        id: ccache
        uses: ./.github/actions/ccache-setup
        with:
          key: sanitizers-ubuntu-22.04

      - name: Run generated runtime and model probes under sanitizers
        run: >-
          cargo nextest run --locked --all-features
          -E 'test(/^(runtime_values|runtime_random|runtime_boundaries|sim_counter|sim_data_types|sim_data_types_next|sim_data_types_completion|sim_type_conformance|sim_partial_features|sim_net_resolution|sim_net_defaults|sim_function|sim_loops|sim_procedural_assign|sim_tagged_union_access|sim_review_next4|sim_review_tasks08_11|sim_fixed_ordering_review|sim_casez|sim_007)::/)'

      - name: Run generated tagged guard library models under sanitizers
        run: >-
          cargo nextest run --locked --all-features --lib
          -E 'test(sim::emit_c::owned::tests::tagged_guards)'

      - name: Report runner resources
        if: always()
        run: |
          echo "logical CPUs: $(nproc)"
          df -h
          free -h
          du -sh target || true

      - name: Compiler cache statistics and save
        if: always()
        uses: ./.github/actions/ccache-finish
        with:
          key: ${{ steps.ccache.outputs.key }}
          cache-hit: ${{ steps.ccache.outputs.cache-hit }}

      - name: Keep only third-party dependencies in target/
        if: always()
        run: python3 scripts/ci_prune_cargo_cache.py --target-dir target

  dependency-audit:
    name: dependency security audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Cargo.lock against RustSec
        run: cargo audit

  build:
    if: github.event_name != 'schedule'
    name: ${{ matrix.name }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # Release build, platform audits and the release-profile test archive; the
    # suite itself runs in the parallel `test` job below.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            runner: windows-2025
            platform: windows
            arch: x86_64
            package_arch: x64
            python_arch: x64
            msvc_arch: amd64
            target: x86_64-pc-windows-msvc
          - name: Windows arm64
            runner: windows-11-vs2026-arm
            platform: windows
            arch: arm64
            package_arch: arm64
            python_arch: arm64
            msvc_arch: amd64_arm64
            target: aarch64-pc-windows-msvc
          - name: macOS arm64
            runner: macos-15
            platform: macos
            arch: arm64
            package_arch: arm64
            python_arch: arm64
            target: aarch64-apple-darwin

    env:
      CMAKE_GENERATOR: Ninja

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      # Compiled registry dependencies for target/<triple>/release plus the
      # host build-script/proc-macro artifacts, about 0.1 to 0.4 GB per target
      # (the nextest archive builds dev-dependencies too). One entry per target.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: deps-v1
          shared-key: release-${{ matrix.target }}
          cache-targets: "true"
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Slang's syntax and diagnostic generators execute during its CMake build.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - uses: taiki-e/install-action@nextest

      - name: Select MSVC target tools
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Pin the MSVC linker for Git Bash steps
        if: matrix.platform == 'windows'
        uses: ./.github/actions/msvc-linker
        with:
          target: ${{ matrix.target }}

      - name: Phase 1 llg_co compile gate with AppleClang
        if: matrix.platform == 'macos'
        shell: bash
        run: scripts/llg-co-compile-gate.sh clang

      - name: Phase 1 llg_co compile gate with MSVC C11
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $gate = Join-Path $env:RUNNER_TEMP "llg-co-gate"
          New-Item -ItemType Directory -Force -Path $gate | Out-Null
          $variants = @(
              @{ Name = "plain"; Definitions = @() },
              @{ Name = "debug"; Definitions = @("/DLLG_CO_DEBUG") },
              @{ Name = "host"; Definitions = @("/DLLG_CO_HOST_ALLOC") },
              @{ Name = "debug-host"; Definitions = @("/DLLG_CO_DEBUG", "/DLLG_CO_HOST_ALLOC") }
          )
          foreach ($variant in $variants) {
              $definitions = @($variant.Definitions)
              $libraryObject = Join-Path $gate "$($variant.Name)-library.obj"
              $includeObject = Join-Path $gate "$($variant.Name)-include.obj"
              & cl.exe /nologo /std:c11 /W4 /WX /c src/sim/rt/llg_co.c "/Isrc/sim/rt" @definitions "/Fo$libraryObject"
              if ($LASTEXITCODE -ne 0) { throw "llg_co.c $($variant.Name) compile failed" }
              & cl.exe /nologo /std:c11 /W4 /WX /c tests/runtime_value_storage/llg_co_include_only.c "/Isrc/sim/rt" @definitions "/Fo$includeObject"
              if ($LASTEXITCODE -ne 0) { throw "include-only $($variant.Name) compile failed" }
          }

      - name: Build release executables
        run: cargo build --locked --release --bin llg_ls --bin llg --target ${{ matrix.target }}

      - name: Build and run generated model with MSVC
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "llg-msvc-generated-model"
          $llg = "target/${{ matrix.target }}/release/llg.exe"
          & $llg --top tb --gen-only --out-dir $root tests/fixtures/sim/dynamic_ownership/numeric_loop.sv
          if ($LASTEXITCODE -ne 0) { throw "llg generated-model export failed" }
          $project = Join-Path $root "sim/tb"
          $build = Join-Path $project "build"
          & cmake -S $project -B $build -G Ninja -DCMAKE_C_COMPILER=cl.exe -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "MSVC generated-model configure failed" }
          & cmake --build $build --config Release
          if ($LASTEXITCODE -ne 0) { throw "MSVC generated-model build failed" }
          $sim = Join-Path $build "bin/sim.exe"
          if (-not (Test-Path -LiteralPath $sim)) {
              $sim = Join-Path $build "bin/Release/sim.exe"
          }
          if (-not (Test-Path -LiteralPath $sim)) { throw "generated simulator was not found" }
          $modelOutput = (& $sim | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "generated simulator failed with $LASTEXITCODE" }
          if ($modelOutput -ne "1007") { throw "unexpected generated-model output: $modelOutput" }

      # Without --cc, LLG_CC or CC, llg compiles models with MSVC cl on Windows.
      - name: Run a generated model with llg's default Windows compiler
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          Remove-Item Env:LLG_CC, Env:CC, Env:LLG_RUNTIME_CACHE_DIR -ErrorAction SilentlyContinue
          $root = Join-Path $env:RUNNER_TEMP "llg-default-compiler-model"
          $llg = "target/${{ matrix.target }}/release/llg.exe"
          $modelOutput = (& $llg --top tb --out-dir $root tests/fixtures/sim/dynamic_ownership/numeric_loop.sv | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "llg default-compiler run failed with $LASTEXITCODE" }
          if ($modelOutput -ne "1007") { throw "unexpected default-compiler model output: $modelOutput" }
          # The model and the runtime archive (cached under the out dir) both.
          $caches = @(Get-ChildItem -LiteralPath $root -Recurse -Filter CMakeCache.txt)
          if ($caches.Count -lt 2) { throw "expected model and runtime CMake caches under $root" }
          foreach ($cache in $caches) {
              $compiler = Select-String -LiteralPath $cache.FullName -Pattern '^CMAKE_C_COMPILER:[A-Z]+=(.*)$' | Select-Object -First 1
              if (-not $compiler -or $compiler.Matches[0].Groups[1].Value -notmatch '(?i)(^|[\\/])cl(\.exe)?$') {
                  throw "$($cache.FullName) does not use MSVC cl: $compiler"
              }
          }

      - name: Verify Windows architecture and static runtime linkage
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $binaries = @(
              "target/${{ matrix.target }}/release/llg_ls.exe",
              "target/${{ matrix.target }}/release/llg.exe"
          )
          & scripts/verify-windows-release.ps1 -Architecture "${{ matrix.arch }}" -Binary $binaries

      - name: Smoke-test Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/llg.exe"
          if ($LASTEXITCODE -ne 2) {
              throw "llg usage smoke test returned $LASTEXITCODE instead of 2"
          }
          # GitHub's pwsh wrapper otherwise propagates the expected exit code 2.
          exit 0

      - name: Verify macOS architecture and system-only dynamic linkage
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          scripts/verify-macos-release.sh \
            "target/${{ matrix.target }}/release/llg_ls" \
            "target/${{ matrix.target }}/release/llg"

      - name: Smoke-test macOS executable
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set +e
          "target/${{ matrix.target }}/release/llg"
          status=$?
          set -e
          test "$status" -eq 2

      # Compile every test executable in the release profile (reusing the
      # release build above) and archive it for the `test` job, which runs the
      # whole suite on a second runner of the same kind. The checkout path and
      # target directory are identical on both runners, so compile-time paths
      # embedded in the test binaries (CARGO_MANIFEST_DIR, CARGO_BIN_EXE_*)
      # resolve after extraction.
      - name: Archive release-profile test binaries
        shell: bash
        run: >-
          cargo nextest archive --locked --all-features --cargo-profile release
          --target ${{ matrix.target }}
          --archive-file target/nextest-archive.tar.zst

      - name: Upload release test archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive-${{ matrix.target }}
          if-no-files-found: error
          # The archive is already zstd-compressed.
          compression-level: 0
          retention-days: 1
          path: target/nextest-archive.tar.zst

      - name: Report runner resources
        if: always()
        shell: bash
        run: |
          echo "logical CPUs: $(getconf _NPROCESSORS_ONLN 2>/dev/null || echo "$NUMBER_OF_PROCESSORS")"
          df -h
          du -sh target || true

      - name: Package macOS executables
        if: github.event_name == 'release' && matrix.platform == 'macos'
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          archive="lapligence-$version-${{ matrix.platform }}-${{ matrix.package_arch }}.tar.gz"
          mkdir -p dist/package
          install -m 755 "target/${{ matrix.target }}/release/llg_ls" dist/package/llg_ls
          install -m 755 "target/${{ matrix.target }}/release/llg" dist/package/llg
          install -m 644 LICENSE readme.md dist/package/
          tar -C dist/package -czf "dist/$archive" llg_ls llg LICENSE readme.md
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$archive" > "$archive.sha256")
          else
            (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          fi

      - name: Package Windows executables
        if: github.event_name == 'release' && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $archive = "lapligence-$version-windows-${{ matrix.package_arch }}.zip"
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/llg_ls.exe" -Destination dist/package/
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/llg.exe" -Destination dist/package/
          Copy-Item -LiteralPath LICENSE, readme.md -Destination dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/$archive"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist/$archive").Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii "dist/$archive.sha256"

      - name: Upload packaged executables
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: lapligence-${{ matrix.platform }}-${{ matrix.package_arch }}
          if-no-files-found: error
          # Packaged archives are already compressed; expire downloads promptly.
          compression-level: 0
          retention-days: 1
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

      # Last step, after every step that reads target/: drop llg, target/slang,
      # the nextest archive and test executables before the cache is saved.
      - name: Keep only third-party dependencies in target/
        if: always()
        shell: bash
        run: python scripts/ci_prune_cargo_cache.py --target-dir target

  # The full release-profile suite for each Windows/macOS target runs from the
  # archive built above on a fresh runner of the same kind, so the build job
  # does not hold its runner while tests run and a test failure leaves the
  # executable audits and packages unaffected. Any failure still blocks the
  # release job. No Rust toolchain is needed to run an archive.
  test:
    if: github.event_name != 'schedule'
    name: ${{ matrix.name }} test (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            runner: windows-2025
            platform: windows
            python_arch: x64
            msvc_arch: amd64
            target: x86_64-pc-windows-msvc
          - name: Windows arm64
            runner: windows-11-vs2026-arm
            platform: windows
            python_arch: arm64
            msvc_arch: amd64_arm64
            target: aarch64-pc-windows-msvc
          - name: macOS arm64
            runner: macos-15
            platform: macos
            python_arch: arm64
            target: aarch64-apple-darwin

    env:
      # Generated-model tests configure CMake with this generator.
      CMAKE_GENERATOR: Ninja

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download release test archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive-${{ matrix.target }}
          path: ${{ runner.temp }}/nextest-archive

      # Tests run python3 helper scripts.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - uses: taiki-e/install-action@nextest

      # Generated models are compiled with MSVC cl, llg's Windows default when
      # LLG_CC and CC are unset, as in the build job.
      - name: Select MSVC target tools
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Pin the MSVC linker for Git Bash steps
        if: matrix.platform == 'windows'
        uses: ./.github/actions/msvc-linker
        with:
          target: ${{ matrix.target }}

      # Generated-model C compiles go through ccache (LLG_C_LAUNCHER). The
      # setup runs after the MSVC environment because it self-checks with the
      # compiler and generator the tests will use (CMAKE_GENERATOR=Ninja, the
      # compiler on PATH) and silently disables itself if that does not hit.
      - name: Set up the generated-model compiler cache
        id: ccache
        uses: ./.github/actions/ccache-setup
        with:
          key: test-${{ matrix.target }}
          python: python

      # The archive carries no build script run, so this fresh checkout still
      # holds the pristine vendor/libfst; the standalone CMake probes need the
      # patched sources the build script applies in place elsewhere.
      - name: Apply the libfst patch
        shell: bash
        run: git apply --whitespace=nowarn --directory=vendor/libfst patches/libfst/libfst-local-changes.patch

      # Extracting into the checkout restores target/ at the build job's
      # compile-time paths.
      - name: Run release suite
        shell: bash
        run: >-
          cargo nextest run --no-fail-fast
          --archive-file "$RUNNER_TEMP/nextest-archive/nextest-archive.tar.zst"
          --workspace-remap "$GITHUB_WORKSPACE" --extract-to "$GITHUB_WORKSPACE"

      # Whether fresh model trees reused CMake toolchain detection: each seed
      # prints its CMake version (ready) or why it was refused (rejected).
      - name: Report CMake toolchain seeds
        if: always()
        shell: bash
        run: |
          find target -maxdepth 3 -type d -name 'cmake-toolchain-*' | while read -r seed; do
            for marker in ready rejected; do
              [ -f "$seed/$marker" ] && echo "$seed $marker: $(head -n 1 "$seed/$marker")"
            done
          done
          true

      - name: Report runner resources
        if: always()
        shell: bash
        run: |
          echo "logical CPUs: $(getconf _NPROCESSORS_ONLN 2>/dev/null || echo "$NUMBER_OF_PROCESSORS")"
          df -h

      - name: Compiler cache statistics and save
        if: always()
        uses: ./.github/actions/ccache-finish
        with:
          key: ${{ steps.ccache.outputs.key }}
          cache-hit: ${{ steps.ccache.outputs.cache-hit }}
          python: python

  linux-build:
    if: github.event_name != 'schedule'
    name: Linux ${{ matrix.arch }} build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            package_arch: x64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            package_arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux verification tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils file

      # Compiled registry dependencies of the container build (target/<triple>
      # release plus the host build-script artifacts, about 0.2 to 0.4 GB) and
      # the Cargo registry mounted into it. There is no rust-cache here, so
      # this restores explicitly and saves after the pruning step below. The
      # key names the toolchain image because compiled artifacts depend on it.
      - name: Restore compiled dependencies
        id: cargo-deps
        uses: actions/cache/restore@v6
        with:
          path: |
            target
            ${{ runner.temp }}/cargo-registry
          key: cargo-deps-v1-${{ matrix.target }}-release-rust1.98.0-alpine-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-deps-v1-${{ matrix.target }}-release-rust1.98.0-alpine-

      - name: Phase 1 llg_co compile gate with GCC and Clang
        shell: bash
        run: scripts/llg-co-compile-gate.sh gcc clang

      # The official Alpine Rust image follows the native runner architecture.
      # It supplies a musl C/C++ toolchain and static system archives without
      # QEMU or a separately downloaded cross compiler. It builds the static
      # musl executables and archives the release-profile test binaries for
      # the linux-test jobs. The checkout is mounted at /workspace here and in
      # every test container because tests embed compile-time paths
      # (CARGO_MANIFEST_DIR, CARGO_BIN_EXE_*).
      - name: Build static musl executables and release test archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-registry"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/cargo-registry:/usr/local/cargo/registry" \
            --workdir /workspace \
            --env CMAKE_GENERATOR=Ninja \
            --env LLG_TARGET="${{ matrix.target }}" \
            rust:1.98.0-alpine sh -euxc '
              apk add --no-cache build-base cmake curl git linux-headers ninja python3
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /workspace/vendor/slang
              rustup target add "$LLG_TARGET"
              export CC=gcc CXX=g++
              case "$LLG_TARGET" in
                x86_64-unknown-linux-musl)
                  export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=gcc
                  nextest_platform=linux-musl
                  ;;
                aarch64-unknown-linux-musl)
                  export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=gcc
                  nextest_platform=linux-arm-musl
                  ;;
                *)
                  echo "unsupported native Linux target: $LLG_TARGET" >&2
                  exit 1
                  ;;
              esac
              cargo build --locked --release --bin llg_ls --bin llg --target "$LLG_TARGET"
              # A small test harness exposes accidental dynamic libc links
              # that larger frontend binaries can mask by pulling libc.a first.
              cargo test --locked --release --test cli_info --target "$LLG_TARGET" -- --list --format terse
              nextest=target/nextest-bin
              mkdir -p "$nextest"
              curl -LsSf "https://get.nexte.st/latest/$nextest_platform" | tar -xzf - -C "$nextest"
              "$nextest/cargo-nextest" nextest archive --locked --all-features --cargo-profile release \
                --target "$LLG_TARGET" --archive-file target/nextest-archive.tar.zst
            '

      - name: Upload release test archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive-${{ matrix.target }}
          if-no-files-found: error
          # The archive is already zstd-compressed.
          compression-level: 0
          retention-days: 1
          path: target/nextest-archive.tar.zst

      - name: Verify Linux architecture and fully static linkage
        shell: bash
        run: |
          scripts/verify-linux-release.sh "${{ matrix.arch }}" \
            "target/${{ matrix.target }}/release/llg_ls" \
            "target/${{ matrix.target }}/release/llg"

      - name: Smoke-test Linux executable
        shell: bash
        run: |
          executable="target/${{ matrix.target }}/release/llg"
          set +e
          "$executable"
          status=$?
          set -e
          test "$status" -eq 2

      - name: Report runner resources
        if: always()
        shell: bash
        run: |
          echo "logical CPUs: $(nproc)"
          df -h
          du -sh target || true

      - name: Package Linux executables
        if: github.event_name == 'release'
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          archive="lapligence-$version-linux-${{ matrix.package_arch }}.tar.gz"
          mkdir -p dist/package
          install -m 755 "target/${{ matrix.target }}/release/llg_ls" dist/package/llg_ls
          install -m 755 "target/${{ matrix.target }}/release/llg" dist/package/llg
          install -m 644 LICENSE readme.md dist/package/
          tar -C dist/package -czf "dist/$archive" llg_ls llg LICENSE readme.md
          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - name: Upload packaged executables
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: lapligence-linux-${{ matrix.package_arch }}
          if-no-files-found: error
          # Packaged archives are already compressed; expire downloads promptly.
          compression-level: 0
          retention-days: 1
          path: |
            dist/*.tar.gz
            dist/*.sha256

      # After every step that reads target/: keep only third-party dependency
      # artifacts (no llg, no target/slang, no test executables or archives).
      # The container ran as root, so the files need sudo to delete.
      - name: Keep only third-party dependencies in target/
        if: always()
        shell: bash
        run: sudo python3 scripts/ci_prune_cargo_cache.py --target-dir target

      # Only the default branch saves; a successful build is required.
      - name: Save compiled dependencies
        if: ${{ success() && github.ref == 'refs/heads/master' && steps.cargo-deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            target
            ${{ runner.temp }}/cargo-registry
          key: ${{ steps.cargo-deps.outputs.cache-primary-key }}

  # Each distribution runs the full release-profile suite from the static musl
  # test archive on its own runner, in parallel with the other distribution
  # and the other platform builds. Neither needs a Rust toolchain; the release
  # job requires every combination to pass.
  linux-test:
    if: github.event_name != 'schedule'
    name: Linux ${{ matrix.arch }} test on ${{ matrix.distro }}
    needs: linux-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        distro: [ubuntu-24.04, rocky-9]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            nextest_platform: linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            nextest_platform: linux-arm-musl
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            install: >-
              export DEBIAN_FRONTEND=noninteractive &&
              apt-get update &&
              apt-get install -y --no-install-recommends
              build-essential clang cmake git ninja-build procps python3
          - distro: rocky-9
            image: rockylinux/rockylinux:9
            # ninja-build ships in the CodeReady Builder (crb) repository.
            install: >-
              dnf install -y --setopt=install_weak_deps=False --enablerepo=crb
              clang cmake gcc gcc-c++ git make ninja-build procps-ng python3 util-linux
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download release test archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive-${{ matrix.target }}
          path: ${{ runner.temp }}/nextest-archive

      # The static musl nextest binary also runs on the glibc distributions.
      - name: Install nextest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          curl -LsSf "https://get.nexte.st/latest/${{ matrix.nextest_platform }}" \
            | tar -xzf - -C "$RUNNER_TEMP/nextest-bin"

      # Downloads and verifies the pinned static ccache on the runner (the
      # minimal containers have no CA bundle guarantee) and restores the cache
      # directory; the container activates it below, where the compiler is.
      - name: Download ccache and restore its cache
        id: ccache
        uses: ./.github/actions/ccache-setup
        with:
          key: linux-${{ matrix.arch }}-${{ matrix.distro }}
          activate: "false"

      # The archive carries no build script run, so this fresh checkout still
      # holds the pristine vendor/libfst; the standalone CMake probes need the
      # patched sources the build script applies in place elsewhere.
      - name: Apply the libfst patch
        shell: bash
        run: git apply --whitespace=nowarn --directory=vendor/libfst patches/libfst/libfst-local-changes.patch

      # Extracting into /workspace restores target/ at the build container's
      # compile-time paths. ccache activation self-checks with the container's
      # cc and degrades to an uncached run on failure; statistics print at the
      # end whatever the suite's status was.
      - name: Run release suite
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ccache" "$RUNNER_TEMP/ccache-bin"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/nextest-archive:/nextest-archive:ro" \
            --volume "$RUNNER_TEMP/nextest-bin:/nextest-bin:ro" \
            --volume "$RUNNER_TEMP/ccache:/ccache" \
            --volume "$RUNNER_TEMP/ccache-bin:/ccache-bin:ro" \
            --workdir /workspace \
            --env NEXTEST_PROFILE \
            --env LLG_INSTALL="${{ matrix.install }}" \
            "${{ matrix.image }}" sh -euxc '
              eval "$LLG_INSTALL"
              touch /tmp/llg-ccache.env
              python3 scripts/ci_ccache.py activate --ccache /ccache-bin/ccache \
                --ccache-dir /ccache --env-format shell --env-file /tmp/llg-ccache.env
              set -a
              . /tmp/llg-ccache.env
              set +a
              status=0
              /nextest-bin/cargo-nextest nextest run --no-fail-fast \
                --archive-file /nextest-archive/nextest-archive.tar.zst \
                --workspace-remap /workspace --extract-to /workspace || status=$?
              python3 scripts/ci_ccache.py stats
              exit $status
            '

      - name: Report runner resources
        if: always()
        shell: bash
        run: |
          echo "logical CPUs: $(nproc)"
          df -h
          free -h

      - name: Save the compiler cache
        if: always()
        uses: ./.github/actions/ccache-finish
        with:
          key: ${{ steps.ccache.outputs.key }}
          cache-hit: ${{ steps.ccache.outputs.cache-hit }}
          stats: "false"

  release:
    name: Attach packages to GitHub release
    if: github.event_name == 'release'
    needs: [lint, generated-runtime-sanitizers, dependency-audit, build, test, linux-build, linux-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: lapligence-*
          merge-multiple: true
          path: dist

      - name: Verify release package set and checksums
        shell: bash
        working-directory: dist
        run: |
          version=${GITHUB_REF_NAME#v}
          for platform in linux-x64 linux-arm64 windows-x64 windows-arm64 macos-arm64; do
            extension=tar.gz
            if [[ "$platform" == windows-* ]]; then
              extension=zip
            fi
            archive="lapligence-$version-$platform.$extension"
            test -s "$archive"
            sha256sum --check "$archive.sha256"
          done

      - name: Attach packages to existing release
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

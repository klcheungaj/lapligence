name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      release-packages: true

  release:
    name: Attach packages to GitHub release
    if: github.event_name == 'release'
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: lapligence-*
          merge-multiple: true
          path: dist

      - name: Verify release package set and checksums
        shell: bash
        working-directory: dist
        run: |
          version=${GITHUB_REF_NAME#v}
          for platform in linux-x64 linux-arm64 windows-x64 windows-arm64 macos-arm64; do
            extension=tar.gz
            if [[ "$platform" == windows-* ]]; then
              extension=zip
            fi
            archive="lapligence-$version-$platform.$extension"
            test -s "$archive"
            sha256sum --check "$archive.sha256"
          done

      - name: Attach packages to existing release
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

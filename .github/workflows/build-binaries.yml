name: Build Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            python_arch: x64
            target: x86_64-unknown-linux-musl
            musl_toolchain: x86_64-linux-musl-cross
          - name: Linux arm64
            runner: ubuntu-24.04
            platform: linux
            arch: arm64
            python_arch: x64
            target: aarch64-unknown-linux-musl
            musl_toolchain: aarch64-linux-musl-cross
          - name: Windows x86_64
            runner: windows-2025
            platform: windows
            arch: x86_64
            python_arch: x64
            msvc_arch: amd64
            target: x86_64-pc-windows-msvc
          - name: Windows arm64
            runner: windows-11-vs2026-arm
            platform: windows
            arch: arm64
            python_arch: arm64
            msvc_arch: amd64_arm64
            target: aarch64-pc-windows-msvc
          - name: macOS arm64
            runner: macos-15
            platform: macos
            arch: arm64
            python_arch: arm64
            target: aarch64-apple-darwin

    env:
      CMAKE_GENERATOR: Ninja

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      # UHDM and ANTLR generators execute during the native CMake build.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          java-package: jre

      - name: Install Python model-generation dependency
        run: python -m pip install --disable-pip-version-check orderedmultidict

      - name: Install static musl toolchain
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils curl file ninja-build patch qemu-user-binfmt tar
          toolchain="${{ matrix.musl_toolchain }}"
          archive="$RUNNER_TEMP/$toolchain.tgz"
          curl -fsSL --retry 3 "https://more.musl.cc/10/x86_64-linux-musl/$toolchain.tgz" -o "$archive"
          mkdir -p "$RUNNER_TEMP/musl"
          tar -xzf "$archive" -C "$RUNNER_TEMP/musl"
          echo "$RUNNER_TEMP/musl/$toolchain/bin" >> "$GITHUB_PATH"
          compiler_prefix="${toolchain%-cross}"
          echo "CC=$compiler_prefix-gcc" >> "$GITHUB_ENV"
          echo "CXX=$compiler_prefix-g++" >> "$GITHUB_ENV"

      - name: Select MSVC target tools
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build release executables
        run: cargo build --locked --release --bin llg_ls --bin llg --target ${{ matrix.target }}

      - name: Verify Linux architecture and fully static linkage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          scripts/verify-linux-release.sh "${{ matrix.arch }}" \
            "target/${{ matrix.target }}/release/llg_ls" \
            "target/${{ matrix.target }}/release/llg"

      - name: Smoke-test Linux executable
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          executable="target/${{ matrix.target }}/release/llg"
          runner=()
          if [[ "${{ matrix.arch }}" == arm64 ]]; then
            runner=(qemu-aarch64)
          fi
          set +e
          "${runner[@]}" "$executable"
          status=$?
          set -e
          test "$status" -eq 2

      - name: Verify Windows architecture and static runtime linkage
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $binaries = @(
              "target/${{ matrix.target }}/release/llg_ls.exe",
              "target/${{ matrix.target }}/release/llg.exe"
          )
          & scripts/verify-windows-release.ps1 -Architecture "${{ matrix.arch }}" -Binary $binaries

      - name: Smoke-test Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/llg.exe"
          if ($LASTEXITCODE -ne 2) {
              throw "llg usage smoke test returned $LASTEXITCODE instead of 2"
          }

      - name: Verify macOS architecture and system-only dynamic linkage
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          scripts/verify-macos-release.sh \
            "target/${{ matrix.target }}/release/llg_ls" \
            "target/${{ matrix.target }}/release/llg"

      - name: Smoke-test macOS executable
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set +e
          "target/${{ matrix.target }}/release/llg"
          status=$?
          set -e
          test "$status" -eq 2

      - name: Package Unix executables
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          version=${GITHUB_REF_NAME//\//-}
          archive="llg-$version-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          mkdir -p dist/package
          install -m 755 "target/${{ matrix.target }}/release/llg_ls" dist/package/llg_ls
          install -m 755 "target/${{ matrix.target }}/release/llg" dist/package/llg
          install -m 644 LICENSE readme.md dist/package/
          tar -C dist/package -czf "dist/$archive" llg_ls llg LICENSE readme.md
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$archive" > "$archive.sha256")
          else
            (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          fi

      - name: Package Windows executables
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '/', '-'
          $archive = "llg-$version-windows-${{ matrix.arch }}.zip"
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/llg_ls.exe" -Destination dist/package/
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/llg.exe" -Destination dist/package/
          Copy-Item -LiteralPath LICENSE, readme.md -Destination dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/$archive"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist/$archive").Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii "dist/$archive.sha256"

      - name: Upload packaged executables
        uses: actions/upload-artifact@v4
        with:
          name: llg-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

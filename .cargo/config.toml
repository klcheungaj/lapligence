[build]
# target = "x86_64-unknown-linux-musl"

[target.x86_64-unknown-linux-musl]
# The linker must come from a musl cross-toolchain.
# Override it with CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER when needed.
# build.rs resolves native compilers through CC_<target>/CXX_<target>, their
# underscore spellings, TARGET_CC/TARGET_CXX, and finally CC/CXX.
linker = "x86_64-linux-musl-gcc"
# Link the musl CRT statically so the final binary has no .so dependencies.
rustflags = ["-C", "target-feature=+crt-static"]

# Suppress libmimalloc-sys's own build-script link output on musl.
# build.rs compiles mimalloc's C source together with mimalloc_shim.c and
# links that combined archive through both library metadata and every final
# package target. This avoids duplicate mimalloc implementations while covering
# targets that do not import the llg library.
[target.x86_64-unknown-linux-musl.mimalloc]
rustc-link-lib = []
rustc-link-search = []

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl.mimalloc]
rustc-link-lib = []
rustc-link-search = []

[target.'cfg(all(target_os = "windows", target_env = "msvc"))']
# Bundle the MSVC and Universal CRT runtimes. Windows SDK/system DLLs remain
# normal dynamic imports and are checked by the release workflow.
rustflags = ["-C", "target-feature=+crt-static"]

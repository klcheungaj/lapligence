[package]
name = "llg"
version = "0.1.0"
edition = "2021"
description = "Lapligence (llg): Verilog/SystemVerilog simulation and language tooling based on Surelog/UHDM"

[lib]
name = "llg"
path = "src/lib.rs"

[features]
default = ["lsp"]
# Builds the experimental Slang frontend and its C ABI shim alongside the
# current Surelog frontend. Slang remains opt-in until the migration gates pass.
slang = []
# LSP-only dependencies.  They are used exclusively by the `llg_ls` binary
# (src/bin/llg_ls), never by the library; the feature is default-on so the
# normal `cargo build --bin llg_ls` flow is unchanged, and can be disabled for
# lib-only builds (e.g. `cargo build --lib --no-default-features`).
#
# `tower` is needed only for the `tower::Service` bound of the exit
# interceptor wrapper in `src/bin/llg_ls/main.rs` (see that file for why).
lsp = [
    "dep:tower-lsp",
    "dep:tokio",
    "dep:dashmap",
    "dep:toml",
    "dep:serde",
    "dep:tower",
]

[[bin]]
name = "llg_ls"
path = "src/bin/llg_ls/main.rs"
required-features = ["lsp"]

[dependencies]
# `llg_ls` and `helloworld` select MiMalloc as their Rust global allocator.
# The `override` feature stays disabled to avoid exporting replacement C++
# allocation symbols. On musl, build.rs separately wraps C malloc/free for all
# binaries with mimalloc_shim.c.
mimalloc = { version = "0.1", default-features = false }

# LSP framework (optional; enabled via the `lsp` feature)
tower-lsp = { version = "0.20", optional = true }
tokio = { version = "1", features = ["io-std", "rt-multi-thread", "macros", "time"], optional = true }
dashmap = { version = "6", optional = true }

# Service trait for the `exit` interceptor (see src/bin/llg_ls/main.rs).
tower = { version = "0.4", default-features = false, optional = true }

# `llg.toml` configuration parsing.  Optional (gated behind the `lsp`
# feature) so lib-only builds (`--no-default-features`) stay lean.
toml = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

num_enum = "0.7"

[target.'cfg(unix)'.dependencies]
# Shared process-memory primitives used by both binaries.  All unsafe calls
# remain wrapped by src/ffi/process_memory.rs.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Narrow Win32 surface used by the shared process-memory safeguard.  Unsafe
# calls remain behind the safe src/ffi/process_memory.rs API.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }


[build-dependencies]
cc = "1.2"
cmake = "0.1"

[dev-dependencies]
# Process-level LSP stdio contract tests (tests/lsp_stdio.rs) speak raw
# JSON-RPC and need a JSON library on the test side.
serde_json = "1"
proptest = "1"

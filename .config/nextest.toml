# Default cargo-nextest configuration, consumed locally and in CI.
#
# nextest executes every test case in its OWN process (unlike `cargo test`,
# which runs one process per integration-test binary), so test binaries run
# concurrently by default.  This is safe for this repository: every suite
# that mutates process-global state (std::env::set_current_dir) serializes
# internally through a mutex within its own binary, and temp directories are
# keyed by std::process::id() — distinct under both models, because nextest
# gives every test a fresh pid and plain cargo test gives every binary one.

[profile.default]
# Eight concurrent test processes is the safe default for ordinary developer
# machines and CI runners.
test-threads = 8

# Conservative: no automatic retries.  Flaky tests must fail loudly; if a
# suite proves flaky under load, fix the race instead of masking it.
retries = 0

# Annotate tests that run longer than 5 minutes as slow (do not terminate).
slow-timeout = { period = "300s" }

# Keep output readable on failure while streaming failures as they happen.
failure-output = "immediate-final"

# Opt in on machines with enough CPU and memory:
# `cargo nextest run --profile max-threads`.
[profile.max-threads]
test-threads = 32

# CI runners are dedicated to one job, so run one test per logical CPU the
# runner reports (nextest honours affinity and cgroup limits) instead of a
# fixed count. The workflow selects it with NEXTEST_PROFILE=ci.
[profile.ci]
test-threads = "num-cpus"

# Frontend-heavy suites (see the group below) get their own concurrency cap;
# lighter suites (emit_decoupling, property_elab, …) run in the default
# full-width pool.
[test-groups]
# The profile's global limit wins normally. This group never runs more
# frontend-heavy processes than logical CPUs, even when a CLI override raises
# global concurrency further.
frontend-heavy = { max-threads = "num-cpus" }

# Route the heavyweight suites into the capped group.  Everything else
# (emit_decoupling, property_elab, …) uses the default full-width pool.
[[profile.default.overrides]]
filter = "binary(/^sim_/) or binary(model_tests) or binary(elab_resolve) or binary(region_conformance) or binary(config_effect) or binary(lsp_stdio) or binary(shadowing) or binary(dump_tokens) or binary(parse_only) or binary(probe_bindings) or binary(lint_config_cli)"
test-group = "frontend-heavy"

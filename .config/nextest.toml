# Default cargo-nextest configuration, consumed locally and in CI.
#
# nextest executes every test case in its OWN process (unlike `cargo test`,
# which runs one process per test binary), so test binaries run concurrently
# by default.  Integration suites are grouped into a few binaries
# (tests/readme.md#test-binaries); suites that mutate process-global state
# either go through the shared harness lock compiled once per group or stay
# standalone binaries, and temp directories are keyed by std::process::id() —
# distinct under both models, because nextest gives every test a fresh pid and
# plain cargo test gives every binary one.

[profile.default]
# Eight concurrent test processes is the safe default for ordinary developer
# machines and CI runners.
test-threads = 8

# Conservative: no automatic retries.  Flaky tests must fail loudly; if a
# suite proves flaky under load, fix the race instead of masking it.
retries = 0

# Annotate tests that run longer than 5 minutes as slow (do not terminate).
slow-timeout = { period = "300s" }

# Keep output readable on failure while streaming failures as they happen.
failure-output = "immediate-final"

# Opt in on machines with enough CPU and memory:
# `cargo nextest run --profile max-threads`.
[profile.max-threads]
test-threads = 32

# CI runners are dedicated to one job, so run one test per logical CPU the
# runner reports (nextest honours affinity and cgroup limits) instead of a
# fixed count. The workflow selects it with NEXTEST_PROFILE=ci.
[profile.ci]
test-threads = "num-cpus"

# Windows on ARM supports only the language server (`llg_ls`); `llg` and
# generated models are unsupported there. Its CI lane archives only the
# library, `llg_ls` and the `general` test binary and selects this profile, whose
# default filter keeps the tests that need neither the simulator, a C compiler,
# CMake nor the `llg` driver:
#   - every `llg_ls` unit test (`llg::bin/llg_ls`);
#   - library tests of the frontend, owned Db, lint, tokens, configuration,
#     native wrappers and memory guard (`core`, `config`, `ffi`,
#     `memory_limit`), not `sim`;
#   - the `general` suites below: the LSP wire suites (`lsp_stdio`, `shadowing`,
#     `dump_tokens`) and the frontend, include, compilation-unit and
#     configuration suites that run no model.
# A suite that executes the simulator or the `llg` driver (model_tests,
# slang_semantics, region_conformance, llg_config_cli, lint_config_cli, ...)
# stays out. A new LSP or frontend-only suite in `general` must be added here;
# `test_layout` rejects names that no longer exist. Command line `-E` filters
# narrow this set further.
[profile.ci-lsp]
inherits = "ci"
default-filter = """
    binary_id(=llg::bin/llg_ls)
    or (binary_id(=llg) and test(/^(core|config|ffi|memory_limit)::/))
    or (binary_id(=llg::general) and test(/^(lsp_stdio|shadowing|dump_tokens|config_effect|compilation_units|include_dir_search|parse_only|probe_bindings|slang_frontend|slang_static_function_return|elab_resolve)::/))
"""

# Frontend-heavy suites (see the group below) get their own concurrency cap;
# lighter suites (emit_decoupling, property_elab, …) run in the default
# full-width pool.
[test-groups]
# The profile's global limit wins normally. This group never runs more
# frontend-heavy processes than logical CPUs, even when a CLI override raises
# global concurrency further.
frontend-heavy = { max-threads = "num-cpus" }

# Route the heavyweight suites into the capped group.  Everything else
# (emit_decoupling, property_elab, …) uses the default full-width pool.
[[profile.default.overrides]]
filter = "binary(/^sim_/) or test(/^(model_tests|elab_resolve|region_conformance|config_effect|lsp_stdio|shadowing|dump_tokens|parse_only|probe_bindings|lint_config_cli)::/)"
test-group = "frontend-heavy"
